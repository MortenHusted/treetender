[package]
name = "treetender"
version = "0.1.0"
edition = "2024"
description = "Ownership-aware local workspace lifecycle core"
license = "MIT"
repository = "https://github.com/MortenHusted/treetender"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.29"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
