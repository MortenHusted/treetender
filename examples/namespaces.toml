# Run only against the disposable namespace_adapter example.
# First: cargo build --example namespace_adapter
# Set TREETENDER_DEMO_ROOT to a disposable directory; put the example binary on PATH.
version = 1

[[resources]]
id = "database"
kind = "data"
target = "database:tt_{workspace_id}"
[resources.adapter]
type = "script"
command = ["namespace_adapter"]
capabilities = ["inspect", "prepare", "destroy"]

[[resources]]
id = "storage"
kind = "data"
target = "storage:tt_{workspace_id}"
[resources.adapter]
type = "script"
command = ["namespace_adapter"]
capabilities = ["inspect", "prepare", "destroy"]

# Preparation order can be declared with depends_on on a resource or task.
# Neither resource starts a service. Stop retains both.
# plan clean --keep database --out cleanup.json, review, then apply cleanup.json
# removes only the owned storage namespace.
