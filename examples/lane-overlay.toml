# A primary checkout's private .treetender.local.toml that prepares every
# linked lane of a web application. Nothing here is tracked by the team's
# repository; lanes inherit it. `scope = "linked"` keeps the primary's own
# configuration and data out of lane preparation and cleanup.
version = 1

[ports.web]
range = [3900, 4099]
scope = "linked"

# Agent context and private settings, linked from the primary when present.
[[resources]]
id = "agent-instructions"
kind = "agent"
scope = "linked"
[resources.adapter]
type = "file"
source_root = "primary"
source = "AGENTS.local.md"
destination = "AGENTS.local.md"
mode = "link"
optional = true

[[resources]]
id = "agent-skills"
kind = "agent"
scope = "linked"
[resources.adapter]
type = "file"
source_root = "primary"
source = ".claude/skills"
destination = ".claude/skills"
mode = "link"
optional = true

[[resources]]
id = "env"
kind = "file"
scope = "linked"
[resources.adapter]
type = "file"
source_root = "primary"
source = ".env"
destination = ".env"
mode = "link"
optional = true

# An isolated development database per lane, on a server described by a
# libpq service entry. Credentials stay in libpq's own files.
[[resources]]
id = "dev-db"
kind = "data"
scope = "linked"
[resources.adapter]
type = "postgres"
database = "app_development_{workspace_ident}"
service = "local"

# Lane configuration rendered from private templates kept in the primary.
# database.yml.template might say: database: app_development_{workspace_ident}
[[resources]]
id = "database-config"
kind = "file"
scope = "linked"
[resources.adapter]
type = "file"
source_root = "primary"
source = "config/database.yml.template"
destination = "config/database.yml"
mode = "template"

# The lane's own Portman stack: a config root inside the lane, and its config
# rendered from a template whose services are named {workspace_name}-web, with
# host = "{workspace_name}.app.test", port = {port:web} and dir = "../../..".
[[resources]]
id = "services"
kind = "service"
scope = "linked"
[resources.adapter]
type = "portman_root"
root = "tmp/workspace/portman"

[[resources]]
id = "services-config"
kind = "file"
scope = "linked"
depends_on = ["services"]
[resources.adapter]
type = "file"
source_root = "primary"
source = "portman.lane.template.toml"
destination = "tmp/workspace/portman/portman.local.toml"
mode = "template"

# Per-lane build output that clean can reclaim.
[[resources]]
id = "node-modules"
kind = "file"
scope = "linked"
[resources.adapter]
type = "directory"
path = "node_modules"
