name: Bug report
description: Report reproducible incorrect behavior in a disposable workspace.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use Security → Report a vulnerability. Do not include credentials, private registry contents or real customer data here."
  - type: input
    id: version
    attributes:
      label: Version or commit and operating system
      placeholder: "Commit SHA, OS version and architecture"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized declarations and commands using disposable resources.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
